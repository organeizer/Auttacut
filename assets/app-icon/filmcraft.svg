      <path d="M256 92 Q270 92 278 108 L418 404 Q426 420 408 420 L104 420 Q86 420 94 404 L234 108 Q242 92 256 92 Z" fill="#2fd0d0" transform="translate(5 0)" opacity="0.9"/>
      <path d="M256 92 Q270 92 278 108 L418 404 Q426 420 408 420 L104 420 Q86 420 94 404 L234 108 Q242 92 256 92 Z" fill="url(#g)"/>
      <path d="M256 92 Q270 92 278 108 L418 404 Q426 420 408 420 L104 420 Q86 420 94 404 L234 108 Q242 92 256 92 Z" fill="url(#scan)"/>
    </g>
