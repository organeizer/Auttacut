<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Auttacut app icon: a sliced, striped "A" in the AuuToSub VHS style. Original work for Auttacut. -->
  <defs>
    <linearGradient id="g" x1="0" y1="96" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a4f"/>
      <stop offset="0.38" stop-color="#b49ab8"/>
      <stop offset="0.52" stop-color="#4f8be8"/>
      <stop offset="0.78" stop-color="#4fb1b0"/>
      <stop offset="1" stop-color="#55c97a"/>
    </linearGradient>
    <clipPath id="cut">
      <rect x="0" y="0" width="512" height="256"/>
      <rect x="0" y="262" width="512" height="30"/>
      <rect x="0" y="300" width="512" height="25"/>
      <rect x="0" y="335" width="512" height="20"/>
      <rect x="0" y="367" width="512" height="15"/>
      <rect x="0" y="396" width="512" height="10"/>
    </clipPath>
    <pattern id="scan" width="512" height="6" patternUnits="userSpaceOnUse">
